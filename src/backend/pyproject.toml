    "azure-mgmt-datafactory>=9.2.0",
    "azure-mgmt-logic>=10.0.0",
    "azure-mgmt-resource>=24.0.0",
    "azure-mgmt-resourcegraph>=8.0.0",
    "azure-monitor-query>=2.0.0",
    "azure-monitor-querymetrics>=1.0.0",
    "debugpy>=1.8.17",
    "dotenv>=0.9.9",
    "fastapi>=0.116.1",
    "fastmcp>=2.12.4",
    "greenlet>=3.2.4",
    "jira>=3.10.5",
    "matplotlib>=3.10.7",
    "openai-chatkit>=1.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pydantic>=2.11.10",
    "pytest>=8.4.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.43",
    "tabulate>=0.9.0",
