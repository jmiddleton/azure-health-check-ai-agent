    "agent-framework>=1.0.0b251001",
    "agent-framework-ag-ui>=1.0.0b251106.post1",
    "aiohttp>=3.12.15",
    "aiosqlite>=0.21.0",
    "apscheduler>=3.11.1",
    "azure-ai-agents>=1.2.0b5",
    "azure-ai-projects>=1.0.0",
